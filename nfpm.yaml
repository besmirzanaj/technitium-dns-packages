name: technitium-dns-server
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Besmir Zanaj <besmirzanaj@gmail.com>
description: |
  Technitium DNS Server - authoritative and recursive DNS server with
  web console, DoH/DoT/DoQ, DNSSEC, ad blocking and DHCP.
  Packaged from the official DnsServerPortable.tar.gz.
vendor: Technitium
homepage: https://technitium.com/dns/
license: GPL-3.0
depends:
  - aspnetcore-runtime-10.0
contents:
  - src: ./stage/opt/technitium/dns/
    dst: /opt/technitium/dns/
    type: tree
  - src: ./packaging/dns.service
    dst: /usr/lib/systemd/system/dns.service
    file_info: { mode: 0644 }
  - dst: /etc/dns
    type: dir
    file_info: { mode: 0750 }
  - dst: /var/log/technitium/dns
    type: dir
    file_info: { mode: 0750 }
scripts:
  preinstall: ./packaging/preinst.sh
  postinstall: ./packaging/postinst.sh
  preremove: ./packaging/prerm.sh
  postremove: ./packaging/postrm.sh
